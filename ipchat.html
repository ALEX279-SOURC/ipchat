<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Persistent Cloud Chat</title>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0d1117; color: #c9d1d9; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    
    /* Login Modal */
    #auth-screen { position: fixed; inset: 0; background: #0d1117; display: flex; align-items: center; justify-content: center; z-index: 100; padding: 20px; }
    .auth-card { background: #161b22; border: 1px solid #30363d; padding: 24px; border-radius: 8px; width: 100%; max-width: 340px; text-align: center; }
    .auth-card input { width: 100%; padding: 10px; margin: 10px 0; background: #0d1117; border: 1px solid #30363d; color: white; border-radius: 4px; outline: none; }
    
    /* Header */
    header { background: #161b22; border-bottom: 1px solid #30363d; padding: 10px 16px; display: flex; justify-content: space-between; align-items: center; }
    .user-info { display: flex; align-items: center; gap: 8px; font-size: 14px; }
    .status-dot { width: 10px; height: 10px; border-radius: 50%; background: #8b949e; display: inline-block; }
    .status-online { background: #2ea043; }
    
    /* Room Controls */
    .controls { background: #161b22; padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 8px; border-bottom: 1px solid #30363d; font-size: 13px; align-items: center; }
    .controls input { padding: 6px 10px; background: #0d1117; border: 1px solid #30363d; color: white; border-radius: 4px; width: 120px; outline: none; }
    
    button { background: #238636; color: white; border: none; padding: 7px 12px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 13px; }
    button:hover { background: #2ea043; }
    .btn-secondary { background: #21262d; border: 1px solid #30363d; }
    .btn-secondary:hover { background: #30363d; }
    .btn-share { background: #1f6feb; }
    .btn-share:hover { background: #388bfd; }
    .btn-users { background: #30363d; padding: 6px 10px; font-size: 14px; display: flex; align-items: center; gap: 4px; }
    .btn-users:hover { background: #484f58; }

    /* Chat Area */
    #chat-box { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; background: #010409; }
    .msg { max-width: 75%; padding: 8px 12px; border-radius: 8px; font-size: 14px; line-height: 1.4; word-break: break-word; }
    .local { background: #1f6feb; color: white; align-self: flex-end; }
    .remote { background: #21262d; color: #c9d1d9; align-self: flex-start; border: 1px solid #30363d; }
    .sender-name { font-size: 11px; color: #8b949e; margin-bottom: 2px; }
    .system { align-self: center; font-size: 11px; color: #8b949e; background: none; }

    /* Footer */
    form { display: flex; padding: 12px; background: #161b22; border-top: 1px solid #30363d; gap: 8px; }
    form input { flex: 1; padding: 10px 14px; background: #0d1117; border: 1px solid #30363d; color: white; border-radius: 4px; outline: none; }

    /* Members Modal Popup */
    #users-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 50; align-items: center; justify-content: center; padding: 15px; }
    .users-card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; width: 100%; max-width: 320px; overflow: hidden; }
    .users-card-header { padding: 12px 16px; border-bottom: 1px solid #30363d; display: flex; justify-content: space-between; align-items: center; }
    .users-list { max-height: 250px; overflow-y: auto; padding: 10px 16px; display: flex; flex-direction: column; gap: 10px; }
    .user-row { display: flex; align-items: center; justify-content: space-between; font-size: 14px; }
    .user-left { display: flex; align-items: center; gap: 8px; }
    .badge-admin { background: #d29922; color: black; font-size: 10px; font-weight: bold; padding: 2px 6px; border-radius: 10px; }
  </style>
</head>
<body>

  <!-- Login Modal -->
  <div id="auth-screen">
    <div class="auth-card">
      <h3 style="margin-bottom: 8px; color: #58a6ff;">Enter Account</h3>
      <p style="font-size: 12px; color: #8b949e; margin-bottom: 10px;">Chat shuru karne ke liye apna username chunein</p>
      <input type="text" id="username-input" placeholder="Choose a Username..." autocomplete="off" />
      <button style="width: 100%; margin-top: 5px;" onclick="handleLogin()">Login / Continue</button>
    </div>
  </div>

  <!-- Connected Users Popup Modal -->
  <div id="users-modal" onclick="closeUsersModal(event)">
    <div class="users-card" onclick="event.stopPropagation()">
      <div class="users-card-header">
        <strong>Room Members 👥</strong>
        <span style="cursor: pointer; font-size: 18px;" onclick="toggleUsersModal()">✕</span>
      </div>
      <div class="users-list" id="users-list-container">
        <span style="font-size: 12px; color: #8b949e;">Connecting room...</span>
      </div>
    </div>
  </div>

  <header>
    <div class="user-info">
      <span class="status-dot status-online"></span>
      <strong id="display-user">User</strong>
    </div>
    <div style="display: flex; align-items: center; gap: 8px;">
      <button class="btn-users" onclick="toggleUsersModal()">👥 <span id="user-count-badge">0</span></button>
    </div>
  </header>

  <div class="controls">
    <input type="text" id="room-code-input" placeholder="4-Digit Code" />
    <button onclick="joinRoom()">Connect</button>
    <button class="btn-secondary" onclick="generateShortRoom()">New Code</button>
    <button class="btn-share" onclick="shareRoomLink()">🔗 Share Link</button>
  </div>

  <div id="chat-box"></div>

  <form id="chat-form">
    <input type="text" id="msg-input" placeholder="Type a message..." autocomplete="off" required />
    <button type="submit">Send</button>
  </form>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBLYPolpV9Z6SadBusB5COPict reed6L%g",
      authDomain: "ipchat-b11e4.firebaseapp.com",
      databaseURL: "https://ipchat-b11e4-default-rtdb.firebaseio.com",
      projectId: "ipchat-b11e4",
      storageBucket: "ipchat-b11e4.firebasestorage.app",
      messagingSenderId: "971834359860",
      appId: "1:971834359860:web:9e2b936ea768806c150339"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const urlParams = new URLSearchParams(window.location.search);
    const urlRoom = urlParams.get('room');

    let currentUser = localStorage.getItem("chat_username") || "";
    let activeRoom = urlRoom || localStorage.getItem("chat_room") || "";
    let roomAdmin = "";
    let messagesListener = null;

    const chatBox = document.getElementById("chat-box");
    const msgInput = document.getElementById("msg-input");

    function appendMessage(sender, text) {
      const isMe = sender === currentUser;
      const div = document.createElement("div");
      div.className = `msg ${isMe ? 'local' : 'remote'}`;
      if (!isMe) {
        div.innerHTML = `<div class="sender-name">${sender}</div>${text}`;
      } else {
        div.textContent = text;
      }
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function appendSystem(text) {
      const div = document.createElement("div");
      div.className = "msg system";
      div.textContent = text;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function toggleUsersModal() {
      const modal = document.getElementById("users-modal");
      modal.style.display = (modal.style.display === "flex") ? "none" : "flex";
    }

    function closeUsersModal(e) {
      document.getElementById("users-modal").style.display = "none";
    }

    function handleLogin() {
      const val = document.getElementById("username-input").value.trim();
      if (!val) return alert("Username required!");
      currentUser = val;
      localStorage.setItem("chat_username", currentUser);
      initUserPresence();
      document.getElementById("auth-screen").style.display = "none";
      document.getElementById("display-user").textContent = currentUser;

      if (activeRoom) {
        document.getElementById("room-code-input").value = activeRoom;
        joinRoom();
      }
    }

    if (currentUser) {
      document.getElementById("username-input").value = currentUser;
      handleLogin();
    } else if (urlRoom) {
      document.getElementById("room-code-input").value = urlRoom;
    }

    function initUserPresence() {
      const userStatusRef = db.ref(`/status/${currentUser}`);
      const connectedRef = db.ref(".info/connected");

      connectedRef.on("value", (snap) => {
        if (snap.val() === true) {
          userStatusRef.onDisconnect().set({ state: "offline", lastChanged: firebase.database.ServerValue.TIMESTAMP });
          userStatusRef.set({ state: "online", lastChanged: firebase.database.ServerValue.TIMESTAMP });
        }
      });
    }

    function generateShortRoom() {
      const code = Math.floor(1000 + Math.random() * 9000).toString();
      document.getElementById("room-code-input").value = code;
    }

    function shareRoomLink() {
      const room = document.getElementById("room-code-input").value.trim();
      if (!room) {
        alert("Pehle 'New Code' dabayein ya Code likhein!");
        return;
      }
      const baseUrl = window.location.origin + window.location.pathname;
      const shareUrl = `${baseUrl}?room=${room}`;

      if (navigator.share) {
        navigator.share({
          title: 'Join My Chat Room',
          text: `Mere sath direct chat room mein judo: Room Code ${room}`,
          url: shareUrl
        }).catch(() => {});
      } else {
        navigator.clipboard.writeText(shareUrl);
        alert(`Direct Chat Link Copy Ho Gayi Hai:\n${shareUrl}`);
      }
    }

    async function joinRoom() {
      const room = document.getElementById("room-code-input").value.trim();
      if (!room) return alert("Pehle 4-Digit Room Code daalein!");

      activeRoom = room;
      localStorage.setItem("chat_room", room);
      chatBox.innerHTML = "";
      appendSystem(`Connected to Room: ${room}`);

      const roomRef = db.ref(`/rooms/${room}`);

      // Check ya assign Room Admin
      const adminSnap = await roomRef.child("admin").once("value");
      if (!adminSnap.exists()) {
        await roomRef.child("admin").set(currentUser);
        roomAdmin = currentUser;
      } else {
        roomAdmin = adminSnap.val();
      }

      // Live Track Admin
      roomRef.child("admin").on("value", (s) => {
        if (s.exists()) roomAdmin = s.val();
      });

      // User presence inside room
      roomRef.child(`users/${currentUser}`).set(true);
      roomRef.child(`users/${currentUser}`).onDisconnect().remove();

      // Listen for Room Members and Status
      roomRef.child("users").on("value", (snap) => {
        const users = snap.val() || {};
        const userList = Object.keys(users);
        document.getElementById("user-count-badge").textContent = userList.length;

        const container = document.getElementById("users-list-container");
        container.innerHTML = "";

        userList.forEach(uname => {
          const isAdmin = uname === roomAdmin;
          const emoji = isAdmin ? "👑" : "🎭";
          
          const row = document.createElement("div");
          row.className = "user-row";
          row.id = `user-row-${uname}`;
          row.innerHTML = `
            <div class="user-left">
              <span>${emoji}</span>
              <strong>${uname} ${uname === currentUser ? "(You)" : ""}</strong>
              ${isAdmin ? '<span class="badge-admin">Admin</span>' : ''}
            </div>
            <div style="display: flex; align-items: center; gap: 6px;">
              <span id="dot-${uname}" class="status-dot"></span>
              <span id="txt-${uname}" style="font-size: 11px; color: #8b949e;">Offline</span>
            </div>
          `;
          container.appendChild(row);

          // Realtime Online/Offline listener for each room member
          db.ref(`/status/${uname}`).on("value", (statusSnap) => {
            const data = statusSnap.val();
            const dot = document.getElementById(`dot-${uname}`);
            const txt = document.getElementById(`txt-${uname}`);
            if (dot && txt) {
              if (data && data.state === "online") {
                dot.className = "status-dot status-online";
                txt.textContent = "Active";
                txt.style.color = "#2ea043";
              } else {
                dot.className = "status-dot";
                txt.textContent = "Offline";
                txt.style.color = "#8b949e";
              }
            }
          });
        });
      });

      // Synchronize Messages
      if (messagesListener) messagesListener.off();
      const messagesRef = roomRef.child("messages");
      messagesListener = messagesRef;

      messagesRef.on("child_added", (snap) => {
        const msg = snap.val();
        appendMessage(msg.sender, msg.text);
      });
    }

    // Message Send Handler
    document.getElementById("chat-form").onsubmit = (e) => {
      e.preventDefault();
      const val = msgInput.value.trim();
      if (!val) return;

      if (!activeRoom) {
        alert("Pehle Room Code daal kar Connect karein!");
        return;
      }

      db.ref(`/rooms/${activeRoom}/messages`).push({
        sender: currentUser,
        text: val,
        timestamp: firebase.database.ServerValue.TIMESTAMP
      });

      msgInput.value = "";
    };
  </script>
</body>
</html>
